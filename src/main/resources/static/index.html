<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>图书管理系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <h1>图书管理系统</h1>

    <!-- 表单卡片：新增 / 编辑共用 -->
    <div class="card">
        <h2 id="formTitle">新增图书</h2>
        <input type="hidden" id="bookId">
        <div class="form-row">
            <div class="form-group">
                <label>书名</label>
                <input type="text" id="bookName" placeholder="请输入书名">
            </div>
            <div class="form-group">
                <label>作者</label>
                <input type="text" id="author" placeholder="请输入作者">
            </div>
            <div class="form-group">
                <label>价格</label>
                <input type="number" id="price" step="0.01" placeholder="0.00">
            </div>
            <div class="form-group">
                <label>库存</label>
                <input type="number" id="stock" placeholder="0">
            </div>
        </div>
        <div class="actions">
            <button class="btn btn-success" onclick="submitBook()">保存</button>
            <button class="btn btn-warning" onclick="resetForm()">重置</button>
        </div>
        <div id="msg"></div>
    </div>

    <!-- 列表卡片 -->
    <div class="card">
        <div class="list-header">
            <h2>图书列表</h2>
            <button class="btn btn-primary" onclick="loadBooks()">刷新</button>
        </div>
        <table>
            <thead>
            <tr>
                <th>ID</th><th>书名</th><th>作者</th><th>价格</th><th>库存</th><th>操作</th>
            </tr>
            </thead>
            <tbody id="bookTable">
            <tr><td colspan="6" class="empty-cell">加载中…</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
